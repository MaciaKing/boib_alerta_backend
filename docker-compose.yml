services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boib-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    #command: "uvicorn app.api.api:app --host 0.0.0.0 --port 8000 --reload"
    command: "tail -f /dev/null"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: boib-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data: